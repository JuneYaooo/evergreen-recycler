<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">老帖翻红排期 · evergreen-recycler</title>
  <desc id="d">从历史帖子里挑出跑赢自己基线的老内容，排成不扎堆、不重复的变体再发计划。插画：一张老帖从档案盒里被挑出、长出新叶，再被贴进再发日历。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6FAF4"/>
      <stop offset="0.55" stop-color="#EAF3EC"/>
      <stop offset="1" stop-color="#DCEBE1"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD891" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFD891" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FD3B4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9FD3B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC861" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFC861" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1F5C44" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123A29"/>
      <stop offset="1" stop-color="#1F6B4C"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC45A"/>
      <stop offset="1" stop-color="#EE9A2E"/>
    </linearGradient>
    <linearGradient id="calHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F5C44"/>
      <stop offset="1" stop-color="#2E7A5B"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99A66"/>
      <stop offset="1" stop-color="#A97A49"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2B886"/>
      <stop offset="1" stop-color="#CF9F6A"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3B0"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FC08A"/>
      <stop offset="1" stop-color="#22865A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F3B28" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F3B28" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F3B28" flood-opacity="0.14"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="560" rx="28"/></clipPath>
    <symbol id="leafShape" viewBox="0 0 40 24">
      <path d="M1 22 C 6 6, 22 0, 39 2 C 36 16, 22 25, 1 22 Z" fill="url(#leaf)"/>
      <path d="M3 21 C 14 15, 24 9, 36 4" stroke="#E8F7EE" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.8"/>
    </symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="560" fill="url(#bg)"/>
    <rect width="1280" height="560" fill="url(#dots)"/>
    <circle cx="1040" cy="90" r="320" fill="url(#glowAmber)"/>
    <circle cx="120" cy="560" r="360" fill="url(#glowGreen)"/>
    <circle cx="700" cy="560" r="220" fill="url(#glowGreen)" opacity="0.6"/>
    <!-- soft hills -->
    <path d="M0 500 C 220 452, 420 520, 640 486 C 860 452, 1060 520, 1280 480 L1280 560 L0 560 Z" fill="#CFE5D7" opacity="0.55"/>
    <path d="M0 530 C 260 500, 520 548, 760 520 C 980 496, 1140 540, 1280 520 L1280 560 L0 560 Z" fill="#B9DAC6" opacity="0.5"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="559" rx="27.5" fill="none" stroke="#1F5C44" stroke-opacity="0.12"/>

  <!-- ============ LEFT: TEXT ============ -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <g transform="translate(80 92)">
      <rect width="264" height="36" rx="18" fill="#1F5C44"/>
      <use href="#leafShape" x="14" y="9" width="26" height="16"/>
      <text x="48" y="24" font-size="16" font-weight="600" fill="#F1FAF4" letter-spacing="0.6">evergreen-recycler</text>
      <text x="208" y="24" font-size="13" fill="#9FD3B4">Skill</text>
    </g>

    <text x="76" y="218" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="3">老帖翻红排期</text>
    <rect x="82" y="236" width="88" height="6" rx="3" fill="url(#amber)"/>

    <text x="80" y="290" font-size="23" fill="#2F4A3D">从历史帖子里挑出<tspan font-weight="700" fill="#1F5C44">跑赢自己基线</tspan>的老内容，</text>
    <text x="80" y="328" font-size="23" fill="#2F4A3D">排成不扎堆、不重复的<tspan font-weight="700" fill="#C9751A">「变体再发」</tspan>计划。</text>

    <!-- feature chips -->
    <g font-size="16" font-weight="600" fill="#1F4A37">
      <g transform="translate(80 372)" filter="url(#shadowSm)">
        <rect width="134" height="44" rx="12" fill="#FFFFFF"/>
        <circle cx="24" cy="22" r="12" fill="#FFF1D6"/>
        <path d="M17 26 L19 17 L22.5 21 L24 15 L25.5 21 L29 17 L31 26 Z" fill="#E8961F"/>
        <text x="44" y="28">自动找赢家</text>
      </g>
      <g transform="translate(226 372)" filter="url(#shadowSm)">
        <rect width="118" height="44" rx="12" fill="#FFFFFF"/>
        <circle cx="24" cy="22" r="12" fill="#E2F2E8"/>
        <rect x="16.5" y="16" width="15" height="13" rx="2.5" fill="none" stroke="#1F7A52" stroke-width="2"/>
        <path d="M16.5 20.5 H31.5" stroke="#1F7A52" stroke-width="2"/>
        <circle cx="21" cy="24.5" r="1.6" fill="#1F7A52"/><circle cx="27" cy="24.5" r="1.6" fill="#F2A93B"/>
        <text x="44" y="28">错峰排期</text>
      </g>
      <g transform="translate(356 372)" filter="url(#shadowSm)">
        <rect width="118" height="44" rx="12" fill="#FFFFFF"/>
        <circle cx="24" cy="22" r="12" fill="#FDE6E0"/>
        <path d="M18 28 L19 23.5 L27.5 15 L31 18.5 L22.5 27 Z" fill="#E2634A"/>
        <path d="M18 28 L19 23.5 L22.5 27 Z" fill="#7A2E20"/>
        <text x="44" y="28">变体改写</text>
      </g>
      <g transform="translate(486 372)" filter="url(#shadowSm)">
        <rect width="118" height="44" rx="12" fill="#FFFFFF"/>
        <circle cx="24" cy="22" r="12" fill="#E3ECF5"/>
        <rect x="17.5" y="20" width="13" height="10" rx="2" fill="#3E6A8F"/>
        <path d="M20 20 V17.5 A4 4 0 0 1 28 17.5 V20" fill="none" stroke="#3E6A8F" stroke-width="2"/>
        <text x="44" y="28">本地计算</text>
      </g>
    </g>

    <text x="82" y="466" font-size="15" fill="#4F6B5D" letter-spacing="0.5">只和你自己的历史比 · 不联网 · 不自动发布 · 不原样重发</text>
  </g>

  <!-- ============ RIGHT: ILLUSTRATION ============ -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">

    <!-- archive box -->
    <g transform="translate(664 330)">
      <ellipse cx="128" cy="150" rx="150" ry="14" fill="#0F3B28" opacity="0.10"/>
      <!-- back wall -->
      <path d="M8 18 L248 18 L236 140 L20 140 Z" fill="url(#box)"/>
      <!-- old cards sticking out -->
      <g transform="rotate(-8 60 10)"><rect x="36" y="-26" width="74" height="70" rx="8" fill="#EEF1EE" stroke="#C9D2CC"/><rect x="46" y="-16" width="54" height="22" rx="4" fill="#D7DDD8"/><rect x="46" y="12" width="40" height="5" rx="2.5" fill="#C3CBC5"/></g>
      <g transform="rotate(5 150 10)"><rect x="118" y="-34" width="74" height="78" rx="8" fill="#F2F4F1" stroke="#C9D2CC"/><rect x="128" y="-24" width="54" height="24" rx="4" fill="#DCE1DC"/><rect x="128" y="6" width="44" height="5" rx="2.5" fill="#C3CBC5"/><rect x="128" y="16" width="30" height="5" rx="2.5" fill="#D3D9D4"/></g>
      <g transform="rotate(-2 210 10)"><rect x="176" y="-18" width="62" height="62" rx="8" fill="#E9EDE9" stroke="#C9D2CC"/><rect x="185" y="-9" width="44" height="18" rx="4" fill="#D2D9D3"/></g>
      <!-- front -->
      <path d="M0 40 L256 40 L244 150 L12 150 Z" fill="url(#boxFront)"/>
      <path d="M0 40 L256 40" stroke="#F3D3A8" stroke-width="3"/>
      <rect x="86" y="74" width="84" height="38" rx="6" fill="#FFF8EC" stroke="#B88655" stroke-opacity="0.5"/>
      <text x="128" y="99" font-size="15" font-weight="700" fill="#7A5330" text-anchor="middle">历史帖子</text>
      <circle cx="40" cy="92" r="4" fill="#B88655" opacity="0.6"/><circle cx="216" cy="92" r="4" fill="#B88655" opacity="0.6"/>
    </g>

    <!-- motion trail from box to lifted card -->
    <g stroke="#E9A23B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" stroke-dasharray="2 9">
      <path d="M760 318 C 752 296, 754 280, 762 262"/>
      <path d="M800 314 C 806 294, 806 280, 800 264"/>
    </g>

    <!-- lifted golden card -->
    <circle cx="790" cy="180" r="140" fill="url(#cardGlow)"/>
    <g transform="rotate(-7 790 180)" filter="url(#shadow)">
      <rect x="704" y="84" width="172" height="196" rx="16" fill="#FFFFFF"/>
      <rect x="704" y="84" width="172" height="196" rx="16" fill="none" stroke="#F2A93B" stroke-width="3"/>
      <rect x="718" y="98" width="144" height="82" rx="10" fill="url(#thumb)"/>
      <!-- mini house drawing inside thumb (a renovation post) -->
      <path d="M760 160 L760 136 L790 116 L820 136 L820 160 Z" fill="#FFFFFF" opacity="0.92"/>
      <rect x="782" y="142" width="16" height="18" rx="2" fill="#F2A93B"/>
      <path d="M754 138 L790 112 L826 138" stroke="#C9751A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="718" y="192" width="120" height="9" rx="4.5" fill="#2F4A3D"/>
      <rect x="718" y="208" width="88" height="7" rx="3.5" fill="#B9C9BF"/>
      <!-- mini stat bars -->
      <g transform="translate(718 230)">
        <rect x="0" y="22" width="10" height="12" rx="2" fill="#CFE0D5"/>
        <rect x="14" y="18" width="10" height="16" rx="2" fill="#CFE0D5"/>
        <rect x="28" y="24" width="10" height="10" rx="2" fill="#CFE0D5"/>
        <rect x="42" y="0" width="10" height="34" rx="2" fill="url(#amber)"/>
        <rect x="56" y="20" width="10" height="14" rx="2" fill="#CFE0D5"/>
      </g>
      <g transform="translate(796 234)">
        <rect width="66" height="30" rx="15" fill="#1F5C44"/>
        <text x="33" y="21" font-size="16" font-weight="800" fill="#FFD27A" text-anchor="middle">≥3×</text>
      </g>
    </g>
    <!-- sprout on the card -->
    <g transform="translate(858 64)">
      <path d="M8 40 C 10 26, 12 16, 16 4" stroke="#22865A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <use href="#leafShape" x="12" y="-6" width="40" height="24"/>
      <g transform="translate(14 14) scale(-1 1)"><use href="#leafShape" x="0" y="0" width="34" height="20"/></g>
    </g>
    <!-- sparkles -->
    <g fill="#F2A93B">
      <path d="M690 112 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
      <path d="M906 196 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" opacity="0.8"/>
      <circle cx="722" cy="66" r="3.5" opacity="0.7"/>
      <circle cx="896" cy="148" r="2.5" opacity="0.7"/>
    </g>

    <!-- arrow to calendar -->
    <path d="M900 248 C 930 290, 944 300, 968 296" stroke="#1F5C44" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 8"/>
    <path d="M960 287 L972 296 L959 305" stroke="#1F5C44" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- calendar -->
    <g filter="url(#shadow)">
      <rect x="978" y="110" width="236" height="296" rx="20" fill="#FFFFFF"/>
      <path d="M978 130 A20 20 0 0 1 998 110 H1194 A20 20 0 0 1 1214 130 V164 H978 Z" fill="url(#calHead)"/>
    </g>
    <g>
      <rect x="1018" y="98" width="8" height="26" rx="4" fill="#123A29"/>
      <rect x="1166" y="98" width="8" height="26" rx="4" fill="#123A29"/>
      <text x="998" y="146" font-size="17" font-weight="700" fill="#FFFFFF">再发排期</text>
      <text x="1194" y="146" font-size="13" fill="#BFE3CE" text-anchor="end">4 周</text>
      <!-- weekday header -->
      <g font-size="11" fill="#7C9387" text-anchor="middle">
        <text x="1008" y="186">一</text><text x="1038" y="186">二</text><text x="1068" y="186">三</text><text x="1098" y="186">四</text><text x="1128" y="186">五</text><text x="1158" y="186">六</text><text x="1188" y="186">日</text>
      </g>
      <!-- grid 4 weeks x 7 -->
      <g fill="#F1F5F2">
        <rect x="995" y="196" width="26" height="26" rx="6"/><rect x="1025" y="196" width="26" height="26" rx="6"/><rect x="1055" y="196" width="26" height="26" rx="6"/><rect x="1085" y="196" width="26" height="26" rx="6"/><rect x="1115" y="196" width="26" height="26" rx="6"/><rect x="1145" y="196" width="26" height="26" rx="6"/><rect x="1175" y="196" width="26" height="26" rx="6"/>
        <rect x="995" y="228" width="26" height="26" rx="6"/><rect x="1025" y="228" width="26" height="26" rx="6"/><rect x="1055" y="228" width="26" height="26" rx="6"/><rect x="1085" y="228" width="26" height="26" rx="6"/><rect x="1115" y="228" width="26" height="26" rx="6"/><rect x="1145" y="228" width="26" height="26" rx="6"/><rect x="1175" y="228" width="26" height="26" rx="6"/>
        <rect x="995" y="260" width="26" height="26" rx="6"/><rect x="1025" y="260" width="26" height="26" rx="6"/><rect x="1055" y="260" width="26" height="26" rx="6"/><rect x="1085" y="260" width="26" height="26" rx="6"/><rect x="1115" y="260" width="26" height="26" rx="6"/><rect x="1145" y="260" width="26" height="26" rx="6"/><rect x="1175" y="260" width="26" height="26" rx="6"/>
        <rect x="995" y="292" width="26" height="26" rx="6"/><rect x="1025" y="292" width="26" height="26" rx="6"/><rect x="1055" y="292" width="26" height="26" rx="6"/><rect x="1085" y="292" width="26" height="26" rx="6"/><rect x="1115" y="292" width="26" height="26" rx="6"/><rect x="1145" y="292" width="26" height="26" rx="6"/><rect x="1175" y="292" width="26" height="26" rx="6"/>
      </g>
      <!-- placed stickers: plan day 1 = Sunday (douyin + time-sensitive xhs), day 2 = Monday (xhs) -->
      <rect x="1175" y="196" width="26" height="26" rx="6" fill="#2F3E4E"/>
      <circle cx="1185" cy="214" r="3.6" fill="#5FE0E8"/>
      <path d="M1188.4 214 V202.5 C1190.5 205.5 1193 206 1195 206" stroke="#5FE0E8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <circle cx="1201" cy="196" r="8" fill="url(#amber)" stroke="#FFFFFF" stroke-width="2"/>
      <text x="1201" y="200.5" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
      <rect x="995" y="228" width="26" height="26" rx="6" fill="#E8604C"/>
      <rect x="1001.5" y="234.5" width="13" height="13" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M1005 241 H1011" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <!-- legend -->
      <g font-size="12" fill="#4F6B5D">
        <rect x="998" y="336" width="10" height="10" rx="3" fill="#E8604C"/><text x="1013" y="345">小红书</text>
        <rect x="1060" y="336" width="10" height="10" rx="3" fill="#2F3E4E"/><text x="1075" y="345">抖音</text>
        <rect x="1112" y="336" width="10" height="10" rx="3" fill="#F2A93B"/><text x="1127" y="345">时效待确认</text>
        <path d="M998.5 365 H1009.5 M998.5 379 H1009.5" stroke="#7C9387" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M1000 365 L1008 365 L1004 372 Z M1004 372 L1008 379 L1000 379 Z" fill="none" stroke="#7C9387" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M1001.6 377.6 L1006.4 377.6 L1004 374 Z" fill="#F2A93B"/>
        <text x="1013" y="377">刚爆的新帖先冷却，满 60 天再排</text>
      </g>
    </g>

    <!-- variant note -->
    <g transform="rotate(-4 960 430)" filter="url(#shadow)">
      <rect x="870" y="392" width="206" height="96" rx="14" fill="#FFF9EE"/>
      <rect x="870" y="392" width="206" height="96" rx="14" fill="none" stroke="#F2D3A0"/>
      <text x="888" y="420" font-size="14" font-weight="700" fill="#7A4A12">文案变体方向</text>
      <g font-size="13" fill="#5C4630">
        <circle cx="893" cy="441" r="3" fill="#E2634A"/><text x="902" y="446">新钩子</text>
        <circle cx="958" cy="441" r="3" fill="#E2634A"/><text x="967" y="446">新角度</text>
        <circle cx="893" cy="465" r="3" fill="#E2634A"/><text x="902" y="470">换开头案例</text>
        <circle cx="984" cy="465" r="3" fill="#E2634A"/><text x="993" y="470">更新数据</text>
      </g>
    </g>
    <!-- pencil -->
    <g transform="translate(1094 470) rotate(-38)">
      <rect x="0" y="-6" width="74" height="12" rx="2" fill="#F2A93B"/>
      <rect x="0" y="-6" width="74" height="4" rx="2" fill="#FFC45A"/>
      <rect x="62" y="-6" width="12" height="12" fill="#E8604C"/>
      <path d="M0 -6 L-16 0 L0 6 Z" fill="#F5DDB8"/>
      <path d="M-11 -2 L-16 0 L-11 2 Z" fill="#2F3E4E"/>
    </g>
  </g>
</svg>
